<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кряжева Наталия Николаевна — визитная карточка</title>
<meta name="description" content="Кряжева Наталия Николаевна — гинеколог, акушер, гинеколог-хирург, к.м.н. Визитная карточка.">
<meta property="og:title" content="Кряжева Наталия Николаевна — визитная карточка">
<meta property="og:description" content="Гинеколог · Акушер · Гинеколог-хирург · к.м.н.">
<style>
  :root{
    --deep:#0B3542; --teal2:#13788C; --mint:#A9E8DB; --gold:#F5B301;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    height:100vh; height:100dvh;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    background:linear-gradient(160deg,var(--deep) 0%,var(--teal2) 100%);
    font-family:-apple-system,"Segoe UI",Roboto,"PT Sans",Arial,sans-serif;
    position:relative;
  }
  .bg{position:absolute;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
  .bg1{width:56vmin;height:56vmin;top:-22vmin;left:50%;transform:translateX(-50%)}
  .bg2{width:38vmin;height:38vmin;bottom:-16vmin;right:-12vmin}
  .bg3{width:26vmin;height:26vmin;bottom:-8vmin;left:-9vmin}

  .card{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:clamp(26px,4.5vw,58px);
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.22);
    border-radius:clamp(20px,3vw,32px);
    padding:clamp(24px,4.5vh,52px) clamp(26px,5vw,64px);
    box-shadow:0 30px 70px rgba(4,25,32,.45);
    max-width:960px;
  }

  .photo{
    flex:none;
    width:clamp(130px,17vw,210px); height:clamp(130px,17vw,210px);
    border-radius:50%;
    border:3px dashed rgba(169,232,219,.65);
    background:rgba(255,255,255,.05);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--mint); text-align:center;
  }
  .photo .cam{font-size:clamp(30px,4vw,48px); line-height:1}
  .photo .cap{font-size:clamp(11px,1.2vw,13px); margin-top:10px; letter-spacing:1px; opacity:.9}

  .info{min-width:0}
  h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(34px,5.2vw,62px);
    color:#fff; letter-spacing:1.5px; line-height:1.05; font-weight:700;
  }
  .name-sub{
    font-size:clamp(17px,2.4vw,26px);
    color:rgba(255,255,255,.92); margin-top:6px;
  }
  .chip{
    color:var(--mint);
    font-size:clamp(11px,1.5vw,15px);
    letter-spacing:clamp(1px,.3vw,4px);
    font-weight:600; text-transform:uppercase;
    margin-top:clamp(10px,2vh,20px);
  }
  .facts{
    font-size:clamp(13px,1.7vw,16px);
    color:rgba(255,255,255,.8); margin-top:clamp(6px,1.2vh,12px);
  }
  .rating{
    display:inline-flex; align-items:center; gap:9px;
    margin-top:clamp(14px,2.6vh,26px);
    padding:8px 16px; border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.3);
    color:#fff; text-decoration:none; font-size:clamp(13px,1.6vw,15px);
    transition:background .15s;
  }
  .rating:hover{background:rgba(255,255,255,.18)}
  .rating .star{color:var(--gold); letter-spacing:2px}
  .phone{
    margin-top:clamp(14px,2.6vh,26px);
    font-size:clamp(19px,2.8vw,29px);
    font-weight:700; color:#fff; white-space:nowrap;
  }

  @media(max-width:700px){
    .card{flex-direction:column; text-align:center; gap:20px; padding:30px 22px; max-width:420px}
    .photo{width:118px;height:118px}
    .info{display:flex; flex-direction:column; align-items:center}
    .phone{font-size:21px}
  }
  @media(max-height:560px){
    .photo{width:104px;height:104px}
    h1{font-size:30px}
    .card{padding:18px 24px; gap:20px}
  }
</style>
</head>
<body>
  <div class="bg bg1"></div>
  <div class="bg bg2"></div>
  <div class="bg bg3"></div>

  <main class="card">
    <div class="photo" aria-label="Место для фото врача">
      <div class="cam">📷</div>
      <div class="cap">фото</div>
    </div>
    <div class="info">
      <h1>КРЯЖЕВА</h1>
      <div class="name-sub">Наталия Николаевна</div>
      <div class="chip">Гинеколог · Акушер · Гинеколог-хирург</div>
      <div class="facts">к.м.н. &nbsp;·&nbsp; стаж 21 год &nbsp;·&nbsp; Роддом НИИАП, Ростов‑на‑Дону</div>
      <a class="rating" href="https://prodoctorov.ru/rostov-na-donu/vrach/159086-popova/" target="_blank" rel="noopener">
        <span class="star">★★★★★</span> 5.0 &nbsp;·&nbsp; 56 отзывов на ПроДокторов
      </a>
      <div class="phone">+7 950 841 42 43</div>
    </div>
  </main>
</body>
</html>
